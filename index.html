<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>황제경 · 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gate.css">
<script src="live-config.js"></script>
</head>
<body data-view="loading">

<!-- 로그인 화면. 포트폴리오 내용은 이 저장소에 없고, 로그인한 뒤에 Supabase 비공개 보관함에서 불러옵니다. -->
<main class="gate">
  <div class="card">
    <h1>황제경</h1>
    <p class="role">포트폴리오</p>
    <p class="lead">로그인하면 포트폴리오를 볼 수 있습니다.</p>

    <div class="tabs">
      <button type="button" id="tab-in" aria-pressed="true">로그인</button>
      <button type="button" id="tab-up" aria-pressed="false">처음이에요 · 가입</button>
    </div>

    <form id="auth">
      <label>이메일
        <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
      </label>
      <label>비밀번호
        <input type="password" name="password" required minlength="6" autocomplete="current-password" placeholder="6자 이상">
      </label>
      <button type="submit" id="go">로그인</button>
    </form>
    <p class="msg" id="msg" role="status"></p>
    <p class="hint" id="hint">처음 오셨다면 위에서 ‘가입’을 눌러 주세요.</p>
  </div>
</main>

<p class="wait" id="wait">불러오는 중…</p>
<iframe id="frame" title="포트폴리오"></iframe>

<script type="module" src="gate.js"></script>
</body>
</html>
